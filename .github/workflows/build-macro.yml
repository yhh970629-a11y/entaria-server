name: Build Entaria EXE

on:
  push:
    branches:
      - main
    paths:
      - "macro.py"
      - "images/**"
      - ".github/workflows/build-macro.yml"

  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install keyboard pyautogui requests websocket-client pillow

      - name: Check files
        shell: powershell
        run: |
          Write-Host "=== Repository files ==="
          Get-ChildItem -Recurse -File | Select-Object FullName

          Write-Host "=== Images ==="
          Get-ChildItem images -File

      - name: Build EXE
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name Entaria `
            --icon images/entaria.ico `
            --add-data "images;images" `
            macro.py

      - name: Check EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist/Entaria.exe")) {
            Write-Error "Entaria.exe was not created."
            exit 1
          }

          Get-Item "dist/Entaria.exe"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Entaria-Windows
          path: dist/Entaria.exe
          if-no-files-found: error
          retention-days: 30
