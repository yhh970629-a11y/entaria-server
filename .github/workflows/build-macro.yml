name: Build Entaria EXE

on:
  push:
    branches:
      - main
    paths:
      - "macro.py"
      - "updater.py"
      - "images/**"
      - ".github/workflows/build-macro.yml"

  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install keyboard pyautogui requests websocket-client pillow

      - name: Check files
        shell: powershell
        run: |
          Write-Host "=== Repository files ==="
          Get-ChildItem -Recurse -File | Select-Object FullName

          Write-Host "=== Images ==="
          Get-ChildItem images -File

      # =====================================================
      # Entaria.exe 빌드
      # =====================================================
      - name: Create version_info.py
        shell: powershell
        run: |
          $version = "1.0.${{ github.run_number }}"

          @"
          APP_VERSION = "$version"
          "@ | Set-Content `
            "version_info.py" `
            -Encoding UTF8

          Write-Host "APP_VERSION = $version"

      - name: Build Entaria
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name Entaria `
            --icon images/entaria.ico `
            --add-data "images;images" `
            macro.py

      # =====================================================
      # EntariaUpdater.exe 빌드
      # =====================================================

      - name: Build EntariaUpdater
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name EntariaUpdater `
            updater.py

      # =====================================================
      # 빌드 결과 확인
      # =====================================================

      - name: Check EXE files
        shell: powershell
        run: |
          Write-Host "=== Build result ==="

          if (!(Test-Path "dist/Entaria.exe")) {
            Write-Error "Entaria.exe was not created."
            exit 1
          }

          if (!(Test-Path "dist/EntariaUpdater.exe")) {
            Write-Error "EntariaUpdater.exe was not created."
            exit 1
          }

          Get-Item "dist/Entaria.exe"
          Get-Item "dist/EntariaUpdater.exe"

      # =====================================================
      # SHA-256 생성
      # =====================================================

      - name: Create version.json
        shell: powershell
        run: |
          $version = "1.0.${{ github.run_number }}"

          $hash = (
            Get-FileHash `
              "dist/Entaria.exe" `
              -Algorithm SHA256
          ).Hash.ToLower()

          Write-Host "Version: $version"
          Write-Host "SHA256: $hash"

          $json = @{
            version = $version
            sha256 = $hash
          } | ConvertTo-Json

          $json | Set-Content `
            "dist/version.json" `
            -Encoding UTF8

          Write-Host "=== version.json ==="
          Get-Content "dist/version.json"

      # =====================================================
      # Artifact
      # =====================================================

      - name: Upload Entaria files
        uses: actions/upload-artifact@v4
        with:
          name: Entaria-Windows
          path: |
            dist/Entaria.exe
            dist/EntariaUpdater.exe
            dist/version.json
          if-no-files-found: error
          retention-days: 30


  # =========================================================
  # 서버 업로드
  # =========================================================

  deploy:
    name: Upload Entaria files to Server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Entaria-Windows
          path: dist

      - name: Check downloaded files
        run: |
          echo "=== Downloaded files ==="
          ls -lh dist/

          test -f dist/Entaria.exe
          test -f dist/EntariaUpdater.exe
          test -f dist/version.json

      - name: Upload Entaria files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/Entaria.exe,dist/EntariaUpdater.exe,dist/version.json"
          target: "/home/yhh1690626/entaria-server/"
          strip_components: 1
